name: Render migration validation (one-time)
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    if: github.event.pull_request.head.ref == 'feature/server-playwright-rendering' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11
      - name: Regenerate NuGet locks
        run: |
          dotnet restore FigVam.sln --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff -- ':(glob)**/packages.lock.json'
      - name: Build
        run: dotnet build FigVam.sln --no-restore
      - name: Install server Chromium
        run: pwsh src/FigVam.Server/bin/Debug/net10.0/playwright.ps1 install chromium
      - name: Verify OpenAPI
        working-directory: src/FigVam.Web
        run: npm run generate:api -- --no-build --check
      - name: MCP protocol tests
        run: dotnet test tests/FigVam.Server.Tests/FigVam.Server.Tests.csproj --no-build --filter FullyQualifiedName~Mcp
      - name: UI dependencies
        working-directory: tests/FigVam.Ui.Tests
        run: npm ci
      - name: Install UI Chromium
        working-directory: tests/FigVam.Ui.Tests
        run: npx playwright install chromium
      - name: MCP screenshot parity
        working-directory: tests/FigVam.Ui.Tests
        run: npx playwright test mcp-login-flow.spec.js --workers=1 --trace off
