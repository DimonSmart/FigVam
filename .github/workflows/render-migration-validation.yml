name: Render migration visual edge cases

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: figvam-render-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    if: github.event.pull_request.head.ref == 'feature/server-playwright-rendering' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/FigVam.Ui.Tests/package-lock.json
      - name: Configure npm 11
        run: npm install --global npm@11
      - name: Restore dependencies
        run: dotnet restore FigVam.sln --locked-mode
      - name: Build solution
        run: dotnet build FigVam.sln --no-restore
      - name: Install server Chromium
        run: pwsh src/FigVam.Server/bin/Debug/net10.0/playwright.ps1 install chromium
      - name: Install UI dependencies
        working-directory: tests/FigVam.Ui.Tests
        run: npm ci
      - name: Install Chromium
        id: chromium
        working-directory: tests/FigVam.Ui.Tests
        run: npx playwright install chromium
      - name: Image clipping, transparency and wrapping parity
        working-directory: tests/FigVam.Ui.Tests
        run: npx playwright test mcp-login-flow.spec.js --grep "MCP-uploaded resource" --workers=1 --trace retain-on-failure
