name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: figvam-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore dependencies
        run: dotnet restore FigVam.sln --locked-mode
      - name: Build solution
        run: dotnet build FigVam.sln --no-restore
      - name: Server tests
        run: dotnet test tests/FigVam.Server.Tests/FigVam.Server.Tests.csproj --no-build --logger "trx;LogFileName=server-tests.trx" --results-directory TestResults
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-diagnostics
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 7

  playwright:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/FigVam.Ui.Tests/package-lock.json
      - name: Restore dependencies
        run: dotnet restore FigVam.sln --locked-mode
      - name: Build solution
        run: dotnet build FigVam.sln --no-restore
      - name: Install UI dependencies
        working-directory: tests/FigVam.Ui.Tests
        run: npm ci
      - name: Install Chromium
        id: chromium
        working-directory: tests/FigVam.Ui.Tests
        run: npx playwright install chromium
      - name: UI test launcher catalog smoke
        run: pwsh -NoProfile -File ./run-ui-tests.ps1 -List
      - name: Home dashboard smoke
        working-directory: tests/FigVam.Ui.Tests
        run: npx playwright test home.spec.js --trace retain-on-failure
      - name: Editor shell smoke
        working-directory: tests/FigVam.Ui.Tests
        run: npx playwright test editor-shell.spec.js --trace retain-on-failure
      - name: Upload home dashboard screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-dashboard-screenshots
          path: tests/FigVam.Ui.Tests/test-results/**/home-desktop.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload editor shell screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-shell-screenshots
          path: tests/FigVam.Ui.Tests/test-results/**/editor-shell-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Login prototype E2E
        working-directory: tests/FigVam.Ui.Tests
        run: npx playwright test login-flow.spec.js --workers=1 --trace retain-on-failure
      - name: Upload login padding screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: login-padding-editor
          path: tests/FigVam.Ui.Tests/test-results/**/login-padding-editor.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Playwright tests
        # A smoke failure must not hide independent regression failures or overwrite its trace.
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        working-directory: tests/FigVam.Ui.Tests
        run: npx playwright test --max-failures=5 --trace retain-on-failure --output=test-results/full-suite
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-diagnostics
          path: tests/FigVam.Ui.Tests/test-results/
          if-no-files-found: ignore
          retention-days: 7

  mcp-locks:
    runs-on: windows-latest
    if: github.head_ref == 'feature/document-mcp'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Regenerate package locks for review
        shell: pwsh
        run: |
          dotnet restore FigVam.sln --force-evaluate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --name-only -- '*packages.lock.json' | ForEach-Object {
            Write-Output "FIGVAM_LOCK_BEGIN $_"
            Get-Content -Raw -LiteralPath $_
            Write-Output "FIGVAM_LOCK_END"
          }
      - name: Build with regenerated locks
        run: dotnet build FigVam.sln --no-restore
      - name: MCP tests
        run: dotnet test tests/FigVam.Server.Tests/FigVam.Server.Tests.csproj --no-build --filter FullyQualifiedName~Mcp
