name: Frontend dependency bootstrap
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/FigVam.Web/**'
      - '.github/workflows/frontend-bootstrap.yml'
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve dependency lock
        working-directory: src/FigVam.Web
        run: |
          npm install --package-lock-only --ignore-scripts
          node -e "const s=require('node:fs').readFileSync('package-lock.json').toString('base64'); for(let i=0;i<s.length;i+=4000) console.log('FIGVAM_LOCK:'+s.slice(i,i+4000));"
      - name: Install and verify
        working-directory: src/FigVam.Web
        run: |
          npm ci
          npm run build
          npm test
